<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Paciente - Clínica Saúde+</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="logo">
            <h1>🏥 Clínica Saúde+</h1>
            <p>Sistema de Agendamento de Consultas</p>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="especialidades.html">Especialidades</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- FORMULÁRIO DE CADASTRO -->
    <div class="form-container">
        <h2 class="form-title">Cadastro de Paciente</h2>
        
        <form id="formCadastro">
            <!-- Nome Completo -->
            <div class="form-group">
                <label for="nome">Nome Completo *</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
            </div>

            <!-- CPF -->
            <div class="form-group">
                <label for="cpf">CPF *</label>
                <input type="text" id="cpf" name="cpf" required placeholder="000.000.000-00">
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">E-mail *</label>
                <input type="email" id="email" name="email" required placeholder="seu.email@example.com">
            </div>

            <!-- Telefone -->
            <div class="form-group">
                <label for="telefone">Telefone *</label>
                <input type="tel" id="telefone" name="telefone" required placeholder="(61) 99999-9999">
            </div>

            <!-- Data de Nascimento -->
            <div class="form-group">
                <label for="data_nascimento">Data de Nascimento *</label>
                <input type="date" id="dataNascimento" name="dataNascimento" required>
            </div>

            <!-- Sexo -->
            <div class="form-group">
                <label>Sexo *</label>
                <select id="sexo" name="sexo" required style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 6px;">
                    <option value="">Selecione</option>
                    <option value="Feminino">Feminino</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>

            <!-- Senha -->
            <div class="form-group">
                <label for="senha">Senha *</label>
                <div class="password-field">
                    <input type="password" id="senha" name="senha" required placeholder="Crie uma senha segura" autocomplete="new-password">
                    <button type="button" class="btn-toggle-password" data-target="senha" aria-label="Mostrar senha" title="Mostrar senha">👁️</button>
                </div>
            </div>

            <!-- Confirmar Senha -->
            <div class="form-group">
                <label for="confirmar_senha">Confirmar Senha *</label>
                <div class="password-field">
                    <input type="password" id="confirmar_senha" name="confirmar_senha" required placeholder="Confirme sua senha" autocomplete="new-password">
                    <button type="button" class="btn-toggle-password" data-target="confirmar_senha" aria-label="Mostrar senha" title="Mostrar senha">👁️</button>
                </div>
            </div>


            <!-- Botão Enviar -->
            <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>

            <!-- Link para Login -->
            <div class="form-link">
                Já tem cadastro? <a href="login.html">Faça login aqui</a>
            </div>
        </form>
    </div>

    <!-- FOOTER -->
    <footer style="text-align: center; padding: 2rem; background-color: #f5f5f5; margin-top: 3rem;">
        <p>&copy; 2026 Clínica Saúde+. Todos os direitos reservados.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/alerts.js"></script>
    <script src="js/config.js"></script>
    <script src="js/cadastro.js"></script>
</body>
</html>
