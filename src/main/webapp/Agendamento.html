<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agendamento - Clínica Saúde+</title>

    <link rel="stylesheet" href="css/styles.css">

    <style>

        /* CONTAINER */
        .agendamento-container{
            max-width:1100px;
            margin:40px auto;
            padding:20px;
        }

        /* CARD */
        .agendamento-card{
            background:white;
            border-radius:12px;
            padding:30px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        /* GRID */
        .agendamento-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:30px;
        }

        /* FORM */
        .form-group{
            margin-bottom:20px;
        }

        .form-group label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:var(--dark-gray);
        }

        .form-group input,
        .form-group select{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
        }

        /* CALENDÁRIO */
        .calendario{
            background:var(--light-gray);
            padding:20px;
            border-radius:10px;
        }

        .calendario-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .calendario-header button{
            background:var(--primary);
            color:white;
            border:none;
            padding:8px 14px;
            border-radius:5px;
            cursor:pointer;
        }

        .dias-semana,
        .dias{
            display:grid;
            grid-template-columns:repeat(7,1fr);
            gap:10px;
            text-align:center;
        }

        .dias-semana div{
            font-weight:bold;
            color:var(--primary);
        }

        .dia,
        .vazio{

            min-height:50px;

            display:flex;
            align-items:center;
            justify-content:center;

            font-weight:bold;

        }

        .vazio{

            background:transparent;

        }

        .dia{
            background:white;
            border-radius:6px;
            cursor:pointer;
            transition:0.3s;
        }

        .dia:hover{
            background:var(--primary);
            color:white;
        }

        .dia.ativo{
            background:var(--success);
            color:white;
        }

        /* HORÁRIOS */
        .horarios{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            margin-top:15px;
        }

        .horario{
            background:white;
            border:1px solid var(--primary);
            color:var(--primary);
            padding:10px 15px;
            border-radius:6px;
            cursor:pointer;
            transition:0.3s;
        }

        .horario:hover{
            background:var(--primary);
            color:white;
        }

        .horario.ativo{
            background:var(--success);
            border-color:var(--success);
            color:white;
        }

        /* RESPONSIVO */
        @media(max-width:900px){

            .agendamento-grid{
                grid-template-columns:1fr;
            }

        }

    
        .btn-logout {
            padding: 10px 20px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-logout:hover {
            background: #b71c1c;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
</style>

</head>

<body>

<!-- HEADER -->
<header>

    <div class="logo">
        <h1>🏥 Clínica Saúde+</h1>
        <p>Sistema de Agendamento de Consultas</p>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="especialidades.html">Especialidades</a></li>
            <li><a href="contato.html">Contato</a></li>
        </ul>
    </nav>

                <div class="header-actions">
                    <button class="btn-logout" onclick="logout()">🚪 Sair</button>
                </div>


</header>

<!-- CONTEÚDO -->
<div class="agendamento-container">

    <div class="agendamento-card">

        <h2 style="margin-bottom:25px;">
            Agendar Consulta
        </h2>

        <div class="agendamento-grid">

            <!-- FORMULÁRIO -->
            <div>

                <div class="form-group">

                    <label>
                        Nome do Paciente
                    </label>

                    <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome">

                </div>

                <div class="form-group">

                    <label>
                        Especialidade
                    </label>

                    <select id="especialidade">

                        <option value="">
                            Selecione
                        </option>

                        <option>
                            Clínica Geral
                        </option>

                        <option>
                            Cardiologia
                        </option>

                        <option>
                            Pediatria
                        </option>

                        <option>
                            Neurologia
                        </option>

                        <option>
                            Ortopedia
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>
                        Data Selecionada
                    </label>

                    <input
                    type="text"
                    id="dataSelecionada"
                    readonly>

                </div>

                <div class="form-group">

                    <label>
                        Horário Selecionado
                    </label>

                    <input
                    type="text"
                    id="horarioSelecionado"
                    readonly>

                </div>

                <button
                class="btn btn-primary"
                id="btnAgendar">

                    Confirmar Agendamento

                </button>

            </div>

            <!-- CALENDÁRIO -->
            <div class="calendario">

                <div class="calendario-header">

                    <button id="prevMes">
                        ◀
                    </button>

                    <h3 id="mesAno"></h3>

                    <button id="nextMes">
                        ▶
                    </button>

                </div>

                <!-- DIAS DA SEMANA -->
                <div class="dias-semana">

                    <div>Dom</div>
                    <div>Seg</div>
                    <div>Ter</div>
                    <div>Qua</div>
                    <div>Qui</div>
                    <div>Sex</div>
                    <div>Sáb</div>

                </div>

                <!-- DIAS -->
                <div
                class="dias"
                id="dias">

                </div>

                <!-- HORÁRIOS -->
                <h3 style="margin-top:25px;">
                    Horários Disponíveis
                </h3>

                <div class="horarios">

                    <div class="horario">08:00</div>
                    <div class="horario">09:00</div>
                    <div class="horario">10:00</div>
                    <div class="horario">11:00</div>
                    <div class="horario">14:00</div>
                    <div class="horario">15:00</div>
                    <div class="horario">16:00</div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- FOOTER -->
<footer>

    <p>
        &copy; 2026 Clínica Saúde+.
        Todos os direitos reservados.
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/alerts.js"></script>
<script src="js/config.js"></script>
<script src="js/agendamento.js"></script>


    <script>
        async function logout() {
            const ok = await window.alerts?.showConfirm({
                title: 'Sair',
                text: 'Deseja realmente sair?',
                confirmButtonText: 'Sair',
                cancelButtonText: 'Cancelar',
                icon: 'question'
            });


            if (ok) {
                localStorage.removeItem('admin');

                localStorage.removeItem('adminLogado');
                localStorage.removeItem('medico');
                localStorage.removeItem('medicoLogado');
                localStorage.removeItem('paciente');
                localStorage.removeItem('pacienteLogado');
                window.location.href = 'index.html';
            }
        }

        // Verifica se está autenticado
        window.addEventListener('load', function() {
            const admin = localStorage.getItem('admin');
            const adminLogado = localStorage.getItem('adminLogado');
            const medico = localStorage.getItem('medico');
            const medicoLogado = localStorage.getItem('medicoLogado');
            const paciente = localStorage.getItem('paciente');
            const pacienteLogado = localStorage.getItem('pacienteLogado');
            
            const pagina = window.location.pathname;
            const requerAutenticacao = ['painel', 'gerenciar', 'gerenciamento', 'Painel', 'agendamento', 'especialidades', 'Agendamento'].some(p => pagina.includes(p));
            
            if (requerAutenticacao && !admin && !adminLogado && !medico && !medicoLogado && !paciente && !pacienteLogado) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
