<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Gerenciar Pacientes</title>

    <link rel="stylesheet" href="css/styles.css">

    <style>

        .container{

            max-width:1200px;
            margin:40px auto;
            padding:20px;

        }

        .table{

            width:100%;
            border-collapse:collapse;
            background:white;
            border-radius:10px;
            overflow:hidden;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);

        }

        .table th{

            background:var(--primary);
            color:white;
            padding:15px;

        }

        .table td{

            padding:15px;
            border-bottom:1px solid #eee;

        }

        .btn-editar{

            background:#ff9800;
            color:white;
            border:none;
            padding:10px 15px;
            border-radius:6px;
            cursor:pointer;
            margin-right:10px;

        }

        .btn-excluir{

            background:#f44336;
            color:white;
            border:none;
            padding:10px 15px;
            border-radius:6px;
            cursor:pointer;

        }

        .btn-editar:hover{

            opacity:0.9;

        }

        .btn-excluir:hover{

            opacity:0.9;

        }

    
        .btn-logout {
            padding: 10px 20px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-logout:hover {
            background: #b71c1c;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
</style>

</head>

<body>

<!-- HEADER -->
<header>

    <div class="logo">

        <h1>🏥 Clínica Saúde+</h1>
        <p>Sistema de Agendamento de Consultas</p>

    </div>

    <nav>

        <ul>

            <li><a href="index.html">Início</a></li>
<li><a href="administrativo.html">
		                Painel Administrativo
		            </a></li>

        </ul>

    </nav>

                <div class="header-actions">
                    <button class="btn-logout" onclick="logout()">🚪 Sair</button>
                </div>


</header>

<!-- CONTEÚDO -->
<div class="container">

    <h2>
        Gerenciamento de Pacientes
    </h2>

    <br>

    <p>
        Aqui você pode visualizar,
        editar e excluir pacientes.
    </p>

    <br><br>

    <!-- TABELA -->
    <table class="table">

        <thead>

            <tr>

                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>E-mail</th>
                <th>Telefone</th>
                <th>Ações</th>

            </tr>

        </thead>

        <tbody id="tabelaPacientes">

        </tbody>

    </table>

</div>

<!-- FOOTER -->
<footer>

    <p>
        &copy; 2026 Clínica Saúde+
    </p>

</footer>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/alerts.js"></script>
<script src="js/config.js"></script>
<script src="js/gerenciamento_Paciente.js"></script>


    <script>
        async function logout() {
            const ok = await window.alerts?.showConfirm({
                title: 'Sair',
                text: 'Deseja realmente sair?',
                confirmButtonText: 'Sair',
                cancelButtonText: 'Cancelar',
                icon: 'question'
            });


            if (ok) {
                localStorage.removeItem('admin');
                localStorage.removeItem('adminLogado');
                localStorage.removeItem('medico');
                localStorage.removeItem('medicoLogado');
                localStorage.removeItem('paciente');
                localStorage.removeItem('pacienteLogado');
                window.location.href = 'index.html';
            }
        }

        // Verifica se está autenticado
        window.addEventListener('load', function() {
            const admin = localStorage.getItem('admin');
            const adminLogado = localStorage.getItem('adminLogado');
            const medico = localStorage.getItem('medico');
            const medicoLogado = localStorage.getItem('medicoLogado');
            const paciente = localStorage.getItem('paciente');
            const pacienteLogado = localStorage.getItem('pacienteLogado');
            
            const pagina = window.location.pathname;
            const requerAutenticacao = ['painel', 'gerenciar', 'gerenciamento', 'Painel', 'agendamento', 'especialidades', 'Agendamento'].some(p => pagina.includes(p));
            
            if (requerAutenticacao && !admin && !adminLogado && !medico && !medicoLogado && !paciente && !pacienteLogado) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
